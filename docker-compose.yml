# Duplicate video engine, headless CLI.
#
# Usage (1 = scan, 2 = review, 3 = move duplicates):
#   docker compose run --rm engine scan --root /videos
#   docker compose run --rm engine groups
#   docker compose run --rm engine confirm --all-pending
#   docker compose run --rm engine apply --dup-root /output/duplicates
#
# Scan and review never move files. Duplicates are MOVED out of VIDEO_DIR into OUTPUT_DIR
# only at the apply step, and only for confirmed groups. Undo: `engine undo --batch ID`
# (see `history`).
#
# VIDEO_DIR / OUTPUT_DIR come from the shell or from a .env file (copy .env.example).
# Defaults: ./videos and ./output.
services:
  engine:
    build: .
    volumes:
      - ${VIDEO_DIR:-./videos}:/videos
      - ${OUTPUT_DIR:-./output}:/output
      - engine-data:/data   # SQLite library + thumbnails

volumes:
  engine-data:
