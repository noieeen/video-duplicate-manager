name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      - name: Install ffmpeg
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          # Chocolatey shims are launchers; point FFMPEG_BIN/FFPROBE_BIN at the real binaries so
          # build_engine.py copies working executables.
          $ff = Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          $fp = Get-ChildItem "C:\ProgramData\chocolatey\lib\ffmpeg" -Recurse -Filter ffprobe.exe | Select-Object -First 1
          if (-not $ff -or -not $fp) { throw "ffmpeg.exe/ffprobe.exe not found after choco install" }
          "FFMPEG_BIN=$($ff.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "FFPROBE_BIN=$($fp.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          $ff.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          & $ff.FullName -version | Select-Object -First 1

      - name: Run tests
        run: python -m pytest -q

      - name: Build engine
        run: python scripts/build_engine.py

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install app dependencies
        working-directory: app
        run: npm ci

      - name: Build installer
        working-directory: app
        run: npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: video-duplicate-manager-windows
          path: app/release/*.exe
          if-no-files-found: error
